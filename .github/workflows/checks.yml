name: CI Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.0
      - run: yarn --version
      - run: yarn install --check-cache
      - run: yarn cichecks
      - name: Start application for smoke test
        run: |
          nohup env NODE_ENV=local-dev yarn ts-node -r tsconfig-paths/register server.ts > /tmp/icp-api.log 2>&1 &
          echo $! > /tmp/icp-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/icp-api.log
          exit 1
      - run: TEST_URL=http://127.0.0.1:8080 yarn test:smoke
